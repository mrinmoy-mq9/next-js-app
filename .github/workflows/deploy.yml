

name: Deploy

on:
  push:
    branches: ["workflow/integration"]



jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - run: docker build . -t mrinmoymq9/next-js-app
      - run: echo ${{secrets.DOCKERHUB_PASSWORD}} | docker login -u ${{secrets.DOCKERHUB_USER}} --password-stdin
      - run: docker push mrinmoymq9/next-js-app:latest

 