
name: Integration

on:
  # push:
  #   branches: ["workflow/integration"]
  pull_request: 
    branches: ["main"]



jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [  18.x , 20.x]


    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version}}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: "Installing Dependency"
        run: npm i 
      - name: "Build command"
        run: npm run build 


  unit-test:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [  18.x  , 20.x]


    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version}}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: "Installing Dependency"
        run: npm i 

      - name: "Running test cases"
        run: npm run test 
